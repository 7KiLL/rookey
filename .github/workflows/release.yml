# Push a tag like v0.1.0 and this builds every release archive, writes the notes from the
# Conventional Commits since the last tag (cliff.toml), and publishes the GitHub release.
# On master it only builds, to fill the cache: a tag's run can read master's cache, not
# another tag's, and whisper.cpp with CUDA takes most of an hour from scratch.
name: release

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths: [Cargo.lock, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-linux, os: ubuntu-22.04 }
          - { name: x86_64-linux-cuda, os: ubuntu-22.04, features: cuda }
          - { name: aarch64-macos, os: macos-15, features: metal }
          - { name: x86_64-windows, os: windows-2022 }
          - { name: x86_64-windows-cuda, os: windows-2022, features: cuda }
    runs-on: ${{ matrix.os }}
    # the signing certificate is in the release environment, which only v* tags can use: a
    # build of master or a branch stays ad-hoc
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      # no GPU on the runner to ask: Turing (RTX 20) and newer, plus PTX for what comes next
      CUDAARCHS: 75-real;86-real;89-real;120-virtual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # ponytail: keyed by Cargo.lock and rustc, so a new stable Rust rebuilds whisper.cpp once;
      # pin the toolchain if that happens too often
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST CUDAARCHS
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        # WebKitGTK for rookey-window only; rookey itself links none of it
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev cmake libwebkit2gtk-4.1-dev
      - name: CUDA
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "13.3.1"
          # its own cache is 4 GB a runner image and would push whisper.cpp's out of the 10 GB
          use-github-cache: false

      - name: Build
        shell: bash
        run: cargo build --release --locked ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: Build the settings window
        run: cargo build --release --locked -p rookey-window
      - name: Sign (macOS)
        # macOS keeps Rookey's permissions for a signing certificate across updates, and asks
        # again after every update of an ad-hoc build. The certificate is rookey's own, not
        # Apple's: MACOS_SIGN_P12 (base64) and MACOS_SIGN_PASSWORD. Without them (a fork)
        # the build stays ad-hoc.
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          # not RCODESIGN_*: rcodesign reads those as settings of its own and fails on them
          SIGNER: apple-codesign-0.29.0-aarch64-apple-darwin
          SIGNER_SHA256: d1a532150adaf90048260d76359261aa716abafc45c53c5dc18845029184334a
        run: |
          if [ -z "$P12" ]; then echo "no MACOS_SIGN_P12: leaving the build ad-hoc"; exit 0; fi
          curl -fsSL -o rcodesign.tar.gz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/$SIGNER.tar.gz"
          echo "$SIGNER_SHA256  rcodesign.tar.gz" | shasum -a 256 -c -
          tar -xzf rcodesign.tar.gz
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/rookey.p12"
          for pair in rookey:io.github.7kill.rookey rookey-window:io.github.7kill.rookey.settings; do
            "$SIGNER/rcodesign" sign --p12-file "$RUNNER_TEMP/rookey.p12" --p12-password "$PASSWORD" \
              --binary-identifier "${pair#*:}" "target/release/${pair%%:*}" "target/release/${pair%%:*}"
          done
          rm -f "$RUNNER_TEMP/rookey.p12"
          codesign -dv target/release/rookey 2>&1 | grep -E 'Identifier|Authority'

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/rookey-${{ matrix.name }}.tar.gz -C target/release rookey rookey-window
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, pack | Out-Null
          Copy-Item target/release/rookey.exe, target/release/rookey-window.exe pack/
          if ("${{ matrix.features }}" -eq "cuda") {
            # users have the NVIDIA driver, not the toolkit: the runtime goes in the zip
            Get-ChildItem -Recurse "$env:CUDA_PATH\bin" -Include cudart64_*.dll, cublas64_*.dll, cublasLt64_*.dll |
              Copy-Item -Destination pack/
          }
          Compress-Archive -Path pack/* -DestinationPath dist/rookey-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: rookey-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the notes read every commit since the last tag
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rookey-*  # the CUDA action uploads its installer log as an artifact too
          path: dist
          merge-multiple: true
      - name: Checksums
        # `rookey update` installs no archive without its line in here
        run: cd dist && sha256sum rookey-* > SHA256SUMS
      - name: Release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: NOTES.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: NOTES.md
          files: |
            dist/*
            install.sh
            install.ps1
