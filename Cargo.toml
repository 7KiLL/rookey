[package]
name = "rookey"
version = "0.1.0"
edition = "2024"
description = "Local push-to-talk dictation: record, transcribe with whisper.cpp, type it out"
license = "Apache-2.0"

[dependencies]
cpal = "0.18"
ctrlc = { version = "3.5", features = ["termination"] }
base64 = "0.23"
dirs = "7"
getrandom = "0.4"  # the page's token, on every system (no /dev/urandom on Windows)
percent-encoding = "2"  # already in the tree through ureq
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4", features = ["multipart"] }
whisper-rs = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"  # the hotkey rookey listens for itself

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }  # typing, the hotkey's key state, whether a recording still runs

[features]
cuda = ["whisper-rs/cuda"]    # Linux + NVIDIA
metal = ["whisper-rs/metal"]  # macOS
