[package]
name = "rookey"
version = "0.2.1"
edition = "2024"
description = "Local push-to-talk dictation: record, transcribe with whisper.cpp, type it out"
license = "Apache-2.0"

[dependencies]
cpal = "0.18"
ctrlc = { version = "3.5", features = ["termination"] }
base64 = "0.23"
dirs = "7"
getrandom = "0.4"  # the page's token, on every system (no /dev/urandom on Windows)
fontdue = "0.9"  # the indicator's words, from the fonts the page already ships
percent-encoding = "2"  # already in the tree through ureq
ring = "0.17"  # the sha256 of an update; already in the tree through rustls
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4", features = ["multipart"] }
whisper-rs = "0.16"
clap = { version = "4.6", features = ["derive", "wrap_help"] }  # the commands, their flags and their help

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"  # the hotkey rookey listens for itself
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }  # the on-screen indicator (layer shell)

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }  # typing, the hotkey's key state, whether a recording still runs, the on-screen pill

[workspace]
# the settings window: a binary of its own, so this one links no webview
members = ["window"]
exclude = [".claude"]  # agent worktrees are copies of this repo, not members

[features]
cuda = ["whisper-rs/cuda"]    # Linux + NVIDIA
metal = ["whisper-rs/metal"]  # macOS
