server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    # the one-liners: curl -fsSL https://rookey.click/install | sh, irm https://rookey.click/install.ps1 | iex
    location = /install     { default_type text/plain; try_files /install.sh =404; }
    location = /install.sh  { default_type text/plain; }
    location = /install.ps1 { default_type text/plain; }

    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
