<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rookey banner</title>
<style>
@font-face { font-family: "Commissioner"; src: url("../../src/ui/commissioner-latin.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Martian Mono"; src: url("../../src/ui/martian-mono-latin.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
:root {
  --paper: #E8EFDF; --raised: #F6F9EF; --ink: #17231E; --soft: #4A5B52; --rule: #B5C9B4; --line: #D7E2CF;
  --red: #C0342B; --eye: #E5584C; --tile: #17231E; --bar: #E8EFDF;
  --voice: "Commissioner", system-ui, sans-serif;
  --keys: "Martian Mono", ui-monospace, monospace;
}
:root[data-theme="dark"] {
  --paper: #121A16; --raised: #1B2621; --ink: #E4ECDD; --soft: #9DB0A3; --rule: #2F4137; --line: #1B2621;
  --red: #F0645A; --eye: #E5584C; --tile: #E4ECDD; --bar: #121A16;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 2560px; height: 800px; overflow: hidden; position: relative; color: var(--ink); font-family: var(--voice); -webkit-font-smoothing: antialiased;
  background: var(--paper) repeating-linear-gradient(to bottom, transparent 0 94px, var(--line) 94px 96px) 0 54px; }
.left { position: absolute; left: 148px; top: 190px; }
.row { display: flex; align-items: center; gap: 56px; }
.row svg { width: 192px; height: 192px; }
.word { font-size: 236px; font-weight: 900; letter-spacing: -0.045em; line-height: 1; margin-top: -8px; }
.tag { font-size: 66px; font-weight: 700; letter-spacing: -0.025em; line-height: 1; margin-top: 78px; }
.kick { font-family: var(--keys); font-size: 27px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); margin-top: 38px; }
.card { position: absolute; left: 1376px; top: 195px; width: 1035px; height: 405px; background: var(--raised); border: 2px solid var(--rule); border-radius: 26px; overflow: hidden; }
.top { height: 90px; padding: 0 44px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--rule); font-family: var(--keys); }
.rec { display: flex; align-items: center; gap: 16px; color: var(--red); font-weight: 700; font-size: 27px; }
.rec::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--red); }
kbd { font-family: var(--keys); font-size: 24px; font-weight: 500; padding: 8px 14px; border: 2.5px solid var(--ink); border-radius: 11px; box-shadow: 0 4px 0 var(--ink); background: var(--raised); color: var(--ink); white-space: nowrap; }
.cols { display: grid; grid-template-columns: 1fr 1fr; height: 311px; }
.col { padding: 42px 44px 0; }
.col + .col { border-left: 3px solid var(--red); }
.kicker { font-family: var(--keys); font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); margin-bottom: 34px; }
.text { font-size: 40px; line-height: 1.45; letter-spacing: -0.01em; }
.typed .text { font-weight: 600; }
s { color: var(--red); text-decoration-thickness: 3px; }
.caret { display: inline-block; width: 3px; height: 1.05em; background: var(--ink); vertical-align: -0.16em; margin-left: 4px; }
</style>
</head>
<body>
<div class="left">
  <div class="row">
    <svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="22" fill="var(--tile)"/><rect x="17" y="17" width="18" height="62" rx="9" fill="var(--bar)"/><rect x="39" y="25" width="18" height="46" rx="9" fill="var(--bar)"/><rect x="61" y="34" width="18" height="28" rx="9" fill="var(--bar)"/><circle cx="26" cy="27" r="4.5" fill="var(--eye)"/></svg>
    <div class="word">rookey</div>
  </div>
  <div class="tag">Say it. It's typed.</div>
  <div class="kick">Dictation · Linux · macOS · Windows</div>
</div>
<div class="card">
  <div class="top"><span class="rec">recording 0:04</span><kbd>Super+Shift+D</kbd></div>
  <div class="cols">
    <div class="col"><div class="kicker">You said</div><div class="text"><s>so um</s> can you push the fix to <s>like</s> main before <s>uh</s> the standup</div></div>
    <div class="col typed"><div class="kicker">rookey typed</div><div class="text">Can you push the fix to main before the standup?<span class="caret"></span></div></div>
  </div>
</div>
<script>if (new URLSearchParams(location.search).get("theme") === "dark") document.documentElement.dataset.theme = "dark";</script>
</body>
</html>
